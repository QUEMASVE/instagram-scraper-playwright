<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado Big Five - IA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #2c3e50; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; margin-bottom: 5px; }
        .btn-volver { display: inline-block; padding: 10px 20px; background: #3498db; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-bottom: 20px; }
        .btn-volver:hover { background: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; }
        blockquote { background: #f9f9f9; border-left: 4px solid #3498db; margin: 1.5em 10px; padding: 0.5em 10px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn-volver">← Volver a los Datos</a>
        <div class="header">
            <h1>🧠 Análisis Exploratorio Big Five</h1>
            <p>Generado con IA vía Groq (Lingüística Computacional)</p>
        </div>

        <div class="content">
            {{ contenido_html | safe }}
        </div>
    </div>
</body>
</html>
