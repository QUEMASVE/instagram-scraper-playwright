<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Perfil - Instagram Scraper</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 30px;
            color: #1c1e21;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: #d62976;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .profile-link {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        .profile-link:hover {
            text-decoration: underline;
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
            border: 1px solid #e1e4e8;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item p {
            margin: 0;
            font-size: 14px;
            color: #65676b;
            font-weight: 600;
            text-transform: uppercase;
        }
        .stat-item span {
            font-size: 24px;
            font-weight: bold;
            color: #111;
        }
        .bio {
            background-color: #f8f9fa;
            border-left: 4px solid #d62976;
            padding: 12px 15px;
            border-radius: 4px;
            color: #4b4f56;
            font-size: 15px;
            margin: 15px 0;
        }
        h2 {
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
            color: #333;
            margin-top: 30px;
        }
        .grid-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .post-card {
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 16px;
            background: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }
        .post-header {
            font-weight: bold;
            color: #d62976;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .metrics {
            display: flex;
            gap: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .post-caption {
            font-size: 13px;
            color: #555;
            margin: 10px 0;
            line-height: 1.4;
        }
        .post-card a {
            display: inline-block;
            margin-top: 8px;
            color: #0095f6;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dashboard de Perfil</h1>
        <p><strong>Perfil analizado:</strong> <a id="perfil-url" class="profile-link" href="#" target="_blank">Cargando...</a></p>
        <div class="bio" id="biografia">Cargando datos...</div>

        <div class="stats-box">
            <div class="stat-item">
                <p>Seguidores</p>
                <span id="val-seguidores">-</span>
            </div>
            <div class="stat-item">
                <p>Seguidos</p>
                <span id="val-seguidos">-</span>
            </div>
            <div class="stat-item">
                <p>Publicaciones Analizadas</p>
                <span id="val-total-posts">-</span>
            </div>
        </div>

        <h2>Publicaciones Analizadas</h2>
        <div class="grid-posts" id="posts-container"></div>
    </div>

    <!-- Carga del archivo generado por Python -->
    <script src="datos.js"></script>

    <script>
        function renderizar() {
            if (typeof datosInstagram === 'undefined') {
                document.getElementById('posts-container').innerHTML = 
                    '<p style="color:red; font-weight:bold;">Ejecuta main.py para generar el archivo datos.js</p>';
                return;
            }

            const data = datosInstagram;

            document.getElementById('perfil-url').href = data.perfil;
            document.getElementById('perfil-url').innerText = data.perfil;
            document.getElementById('biografia').innerText = data.estadisticas_perfil.resumen_meta_original || "Sin biografía disponible";

            document.getElementById('val-seguidores').innerText = data.estadisticas_perfil.seguidores;
            document.getElementById('val-seguidos').innerText = data.estadisticas_perfil.seguidos;
            document.getElementById('val-total-posts').innerText = data.total_publicaciones_analizadas;

            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            data.publicaciones_detalle.forEach((post, index) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">Publicación #${index + 1}</div>
                    <div class="metrics">
                        <span>❤️ <strong>${post.likes}</strong> Likes</span>
                        <span>💬 <strong>${post.comentarios}</strong> Comentarios</span>
                    </div>
                    <div class="post-caption">${post.resumen_meta || 'Sin descripción'}</div>
                    <a href="${post.url}" target="_blank">Ver en Instagram ↗</a>
                `;
                container.appendChild(card);
            });
        }

        renderizar();
    </script>

</body>
</html>
